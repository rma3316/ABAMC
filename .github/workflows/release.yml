name: Build Application and Make Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-slim
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          cp PrismLauncher-Linux-*-x86_64.AppImage/ABAMC_Linux-x86_64.AppImage ABAMC_Linux-x86_64.AppImage
          cp PrismLauncher-Linux-*-aarch64.AppImage/ABAMC_Linux-aarch64.AppImage ABAMC_Linux-aarch64.AppImage
          cp PrismLauncher-macOS*.dmg/ABAMC.dmg ABAMC_macOS.dmg
          cp PrismLauncher-Windows-MSVC-Setup-*/ABAMC-Setup.exe ABAMC_Windows-x64.exe
          cp PrismLauncher-Windows-MSVC-arm64-Setup-*/ABAMC-Setup.exe ABAMC_Windows-arm64.exe

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: ABAMC ${{ env.VERSION }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ABAMC_Linux-x86_64.AppImage
            ABAMC_Linux-aarch64.AppImage
            ABAMC_Windows-x64.exe
            ABAMC_Windows-arm64.exe
            ABAMC_macOS.dmg
